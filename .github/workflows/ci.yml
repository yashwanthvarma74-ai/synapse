name: CI

on:
  push:
  pull_request:

# the least access the jobs need
permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Next.js generates some types (LayoutProps, route types); a fresh checkout does not have them yet
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  server:
    name: Server (types, tests against real MongoDB and Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # the tests talk to MongoDB on 27017 and Redis on 6379, exactly like local development
    services:
      mongodb:
        # Pinned to an exact patch release on purpose. Newer MongoDB releases (including the floating mongo:8 and
        # mongo:8.0 tags) refuse to start on the Linux kernel 6.19+ that GitHub's runners now use
        # (SERVER-121912, no fix released). 8.0.4 is what the fault-injection job below runs on the same runner.
        image: mongo:8.0.4
        ports: ['27017:27017']
      redis:
        image: redis:8
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Wait for the database
        working-directory: .
        run: |
          for port in 27017 6379; do
            timeout 60 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done" || { echo "nothing is listening on $port"; docker ps -a; docker logs "$(docker ps -aq --filter ancestor=mongo:8.0.4 | head -1)" 2>&1 | tail -30; exit 1; }
          done
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # Kills and restarts real Redis and MongoDB processes and crashes gateways, so it needs the binaries
  # themselves (service containers cannot be killed from the test). Separate job: it takes a minute or two.
  server-fault:
    name: Server fault injection (Redis and MongoDB killed, gateways crashed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install redis-server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Install mongod
        working-directory: .
        run: |
          curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.4.tgz | tar -xz -C "$HOME"
          echo "$HOME/mongodb-linux-x86_64-ubuntu2204-8.0.4/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: mongod --version | head -1 && redis-server --version
      - run: npm run test:fault

  observability:
    name: Monitoring config (alert rules valid, dashboard up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/obs" prom/prometheus:latest check config /obs/prometheus.yml
      - name: The availability alerts fire when they should (and stay quiet when they should)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/obs" prom/prometheus:latest test rules /obs/tests/slo_test.yml
      - name: The committed dashboard matches its generator
        run: |
          python3 observability/build-dashboard.py
          git diff --exit-code -- observability/grafana/dashboards/synapse.json

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    services:
      mongodb:
        # Pinned to an exact patch release on purpose. Newer MongoDB releases (including the floating mongo:8 and
        # mongo:8.0 tags) refuse to start on the Linux kernel 6.19+ that GitHub's runners now use
        # (SERVER-121912, no fix released). 8.0.4 is what the fault-injection job below runs on the same runner.
        image: mongo:8.0.4
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            e2e/package-lock.json
      - name: Wait for the database
        working-directory: .
        run: |
          for port in 27017; do
            timeout 60 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done" || { echo "nothing is listening on $port"; docker ps -a; docker logs "$(docker ps -aq --filter ancestor=mongo:8.0.4 | head -1)" 2>&1 | tail -30; exit 1; }
          done
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      # Playwright starts its own copy of the server and a production build of the web app
      - run: npm test
        working-directory: e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
